<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found | Mahanaayak OS</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/buttons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: var(--bg-0);
        text-align: center;
        padding: var(--space-4);
      }
      .error-code {
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: var(--space-2);
      }
      .error-title {
        font-size: 32px;
        color: var(--text-0);
        margin-bottom: var(--space-3);
      }
      .error-msg {
        color: var(--text-1);
        max-width: 500px;
        margin-bottom: var(--space-6);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
       <div class="error-code">404</div>
       <h1 class="error-title">Sector Not Found</h1>
       <p class="error-msg">The intelligence node you are trying to access does not exist or has been relocated. Please return to the command center.</p>
       <a href="war-room.html" class="action-button button-blue px-4 py-2"><i class="fa-solid fa-house mr-2"></i> Return to War Room</a>
    </div>
  </body>
</html>
